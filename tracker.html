<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Breljak – Job Hunt Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #EFE8D6;
            --paper-raised: #E6DCC0;
            --line: #D3C6A0;
            --line-strong: #B8A878;
            --ink: #1C2430;
            --ink-soft: #5B6270;
            --ink-faint: #9AA0AD;
            --red: #B3261E;
            --red-bg: #F6DAD6;
            --green: #15803D;
            --green-bg: #D6EEDD;
            --amber: #92650A;
            --amber-bg: #F3E6C8;
            --blue: #2C3A66;
            --blue-bg: #DAE0EE;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--paper);
            color: var(--ink);
            padding: 3.5rem 1.5rem;
            line-height: 1.55;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        .page {
            max-width: 1180px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding-bottom: 1.25rem;
            border-bottom: 2px solid var(--ink);
        }

        .page-title {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 2.1rem;
            letter-spacing: -0.01em;
            line-height: 1.05;
        }

        .page-subtitle {
            font-size: 0.8rem;
            color: var(--ink-soft);
            margin-top: 0.55rem;
        }

        .back-link {
            font-size: 0.78rem;
            color: var(--ink-soft);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--ink);
            text-decoration: underline;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .tally {
            display: flex;
            border: 1px solid var(--line-strong);
        }

        .tally-item {
            padding: 0.55rem 1rem;
            border-left: 1px solid var(--line-strong);
            text-align: center;
        }

        .tally-item:first-child {
            border-left: none;
        }

        .tally-num {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.2rem;
            line-height: 1.1;
        }

        .tally-label {
            font-size: 0.6rem;
            color: var(--ink-soft);
            margin-top: 3px;
        }

        .ink-btn {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--ink);
            text-decoration: none;
            padding: 0.5rem 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
        }

        .ink-btn:hover,
        .ink-btn:focus-visible {
            background: var(--ink);
            color: var(--paper);
        }

        .ink-btn:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }

        .btn-plain {
            background: none;
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.74rem;
            color: var(--ink-soft);
            cursor: pointer;
            padding: 0.3rem 0.1rem;
        }

        .btn-plain:hover,
        .btn-plain:focus-visible {
            color: var(--ink);
            text-decoration: underline;
        }

        .btn-plain.danger {
            color: var(--red);
        }

        .btn-plain.danger:hover {
            color: var(--red);
        }

        .storage-note {
            font-size: 0.7rem;
            color: var(--ink-faint);
            margin-top: 0.75rem;
        }

        .slip {
            border: 1px solid var(--ink);
            padding: 1.25rem 1.25rem 1rem;
            margin: 1.5rem 0;
            display: none;
        }

        .slip.open {
            display: block;
        }

        .slip-title {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.15rem;
            margin-bottom: 1.1rem;
        }

        .slip-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem 1.25rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .field.span-2 { grid-column: span 2; }
        .field.span-4 { grid-column: span 4; }

        .field label {
            font-size: 0.66rem;
            color: var(--ink-soft);
        }

        .field input,
        .field select {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.82rem;
            color: var(--ink);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line-strong);
            border-radius: 0;
            padding: 0.35rem 0.1rem;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-bottom: 2px solid var(--ink);
        }

        .slip-actions {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-top: 1.25rem;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 1rem;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 980px;
            font-family: 'IBM Plex Mono', monospace;
        }

        thead th {
            text-align: left;
            font-size: 0.66rem;
            font-weight: 500;
            color: var(--ink-faint);
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid var(--line-strong);
            white-space: nowrap;
        }

        tbody td {
            padding: 0.7rem 0.6rem;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        /* Marks the boundary between open and rejected applications — a
           double rule, like the line a ledger draws before a subtotal. */
        .stage-boundary td {
            border-bottom: 4px double var(--ink);
            padding-bottom: 0.95rem;
        }

        tbody tr:hover {
            background: var(--paper-raised);
        }

        .cell-job {
            font-weight: 600;
        }

        .cell-muted {
            color: var(--ink-soft);
        }

        .cell-faint {
            color: var(--ink-faint);
        }

        .stamp {
            display: inline-block;
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border: 1px solid currentColor;
        }

        .stamp-red { color: var(--red); background: var(--red-bg); }
        .stamp-green { color: var(--green); background: var(--green-bg); }
        .stamp-amber { color: var(--amber); background: var(--amber-bg); }
        .stamp-blue { color: var(--blue); background: var(--blue-bg); }

        .jd-link {
            font-size: 0.78rem;
            color: var(--ink-soft);
            text-decoration: none;
        }

        .jd-link:hover {
            color: var(--ink);
            text-decoration: underline;
        }

        .row-actions {
            display: flex;
            gap: 0.75rem;
            white-space: nowrap;
        }

        .empty-state {
            font-size: 0.8rem;
            color: var(--ink-soft);
            padding: 2rem 0.25rem;
            text-align: center;
            border-top: 1px solid var(--line);
            margin-top: 1rem;
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="page-header">
            <div>
                <h1 class="page-title">Job Hunt Tracker</h1>
                <p class="page-subtitle">Every application, its stage, and where it stands.</p>
            </div>
            <a class="back-link" href="index.html">&lsaquo; Job Applications</a>
        </div>

        <div class="toolbar">
            <div class="tally" id="tally-row"></div>
            <button class="ink-btn" id="add-toggle-btn">+ Add Application</button>
        </div>
        <p class="storage-note">Saved in this browser only — not synced across devices or visible to Claude.</p>

        <div class="slip" id="form-card">
            <div class="slip-title" id="form-title">New entry</div>
            <div class="slip-grid">
                <div class="field span-2">
                    <label for="f-job">Job</label>
                    <input type="text" id="f-job" placeholder="Role title">
                </div>
                <div class="field span-2">
                    <label for="f-company">Company</label>
                    <input type="text" id="f-company" placeholder="Company name">
                </div>
                <div class="field">
                    <label for="f-platform">Platform</label>
                    <input type="text" id="f-platform" list="platform-options" placeholder="LinkedIn">
                    <datalist id="platform-options">
                        <option value="LinkedIn">
                        <option value="jobs.ch">
                        <option value="Indeed">
                        <option value="Xing">
                        <option value="Company website">
                        <option value="Email">
                    </datalist>
                </div>
                <div class="field">
                    <label for="f-status">Status</label>
                    <select id="f-status">
                        <option value="Completed">Completed</option>
                        <option value="Waiting">Waiting</option>
                        <option value="Draft">Draft</option>
                    </select>
                </div>
                <div class="field">
                    <label for="f-stage">Stage</label>
                    <select id="f-stage">
                        <option value="Waiting answer">Waiting answer</option>
                        <option value="Rejected">Rejected</option>
                        <option value="Interview">Interview</option>
                        <option value="Offer">Offer</option>
                    </select>
                </div>
                <div class="field">
                    <label for="f-date">Date sent</label>
                    <input type="text" id="f-date" placeholder="dd/mm/yyyy">
                </div>
                <div class="field span-2">
                    <label for="f-link">Link to job description</label>
                    <input type="text" id="f-link" placeholder="https://...">
                </div>
                <div class="field span-4">
                    <label for="f-notes">Notes</label>
                    <input type="text" id="f-notes" placeholder="Optional">
                </div>
            </div>
            <div class="slip-actions">
                <button class="ink-btn" id="form-save-btn">Save</button>
                <button class="btn-plain" id="form-cancel-btn">Cancel</button>
            </div>
        </div>

        <div class="table-wrap">
            <table id="tracker-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Job</th>
                        <th>Company</th>
                        <th>Platform</th>
                        <th>Status</th>
                        <th>Stage</th>
                        <th>Date sent</th>
                        <th>Job description</th>
                        <th>Notes</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tracker-body"></tbody>
            </table>
        </div>
        <p class="empty-state" id="empty-state" style="display:none;">No applications tracked yet. Add the first one above.</p>
    </div>

    <script>
        // Seed data used only the first time this page loads in a given
        // browser. After that, all reads/writes go through localStorage
        // (see STORAGE_KEY below) via the Add/Edit/Delete UI — this array
        // is no longer touched, add/edit/delete happen entirely on-page.
        const seedApplications = [
            { job: "Digital Marketing Manager", company: "Cultural Care Au Pair", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "26/07/2026", link: "", notes: "" },
            { job: "Analytics & Insights Manager", company: "Aman", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "27/07/2026", link: "", notes: "" },
            { job: "Senior Digital & E-Commerce Manager", company: "Hemro", platform: "LinkedIn", status: "Completed", stage: "Waiting answer", dateSent: "28/07/2026", link: "", notes: "" },
            { job: "Digital Campaign Manager", company: "Havas", platform: "LinkedIn", status: "Completed", stage: "Waiting answer", dateSent: "28/07/2026", link: "", notes: "" },
            { job: "Senior Business & Process Analyst", company: "TUI", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "28/07/2026", link: "", notes: "" },
            { job: "Ad Operations Consultant", company: "WPP Media", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "29/07/2026", link: "", notes: "too high salary demand" },
            { job: "Digital Marketing Senior Analyst", company: "Salesforce", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "30/07/2026", link: "", notes: "" },
            { job: "Digital Marketing Specialist", company: "The Living Circle", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "30/07/2026", link: "", notes: "" },
            { job: "Performance Marketing Manager", company: "RealWear", platform: "LinkedIn", status: "Completed", stage: "Interview", dateSent: "30/07/2026", link: "", notes: "" },
            { job: "Technical E-Commerce Manager", company: "SF-Filter Group", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "25/08/2026", link: "", notes: "" },
            { job: "Digital Marketing Manager", company: "Pfister", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "25/08/2026", link: "", notes: "" },
            { job: "Digital Marketing Manager (mit technischem Fokus)", company: "HOMM", platform: "jobs.ch", status: "Completed", stage: "Waiting answer", dateSent: "26/08/2026", link: "", notes: "sent by an email" },
            { job: "Ads Specialist / Performance Marketing", company: "Lengacher & Partner", platform: "LinkedIn", status: "Completed", stage: "Waiting answer", dateSent: "26/08/2026", link: "", notes: "" },
            { job: "Audience Engagement Manager:in", company: "CH Media", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "31/08/2026", link: "", notes: "" },
            { job: "(Senior) Growth Marketer – E-Commerce", company: "Pflegewegweiser GmbH", platform: "LinkedIn", status: "Completed", stage: "Rejected", dateSent: "31/08/2026", link: "", notes: "" },
            { job: "Technical Marketing Manager (50% - 100%)", company: "iRIX Software Engineering AG", platform: "LinkedIn", status: "Completed", stage: "Interview", dateSent: "02/09/2026", link: "", notes: "" },
            { job: "Paid Media Performance Manager", company: "Emil Frey", platform: "LinkedIn", status: "Completed", stage: "Waiting answer", dateSent: "02/09/2026", link: "", notes: "" }
        ];

        const STORAGE_KEY = 'jobTracker.records.v1';

        function loadRecords() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { /* fall through to seed */ }
            const seeded = seedApplications.map((a, i) => ({ id: `seed-${i}`, ...a }));
            saveRecords(seeded);
            return seeded;
        }

        function saveRecords(records) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            } catch (e) {
                alert('Could not save — this browser may be blocking local storage (e.g. private/incognito mode).');
            }
        }

        let records = loadRecords();
        let editingId = null;

        const table = document.getElementById('tracker-table');
        const tbody = document.getElementById('tracker-body');
        const emptyState = document.getElementById('empty-state');
        const tallyRow = document.getElementById('tally-row');
        const formCard = document.getElementById('form-card');
        const formTitle = document.getElementById('form-title');
        const addToggleBtn = document.getElementById('add-toggle-btn');
        const formSaveBtn = document.getElementById('form-save-btn');
        const formCancelBtn = document.getElementById('form-cancel-btn');

        function formEl(name) { return document.getElementById('f-' + name); }

        function stageStamp(stage) {
            if (stage === "Rejected") return "stamp-red";
            if (stage === "Interview") return "stamp-green";
            if (stage === "Offer") return "stamp-blue";
            return "stamp-amber";
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function openAddForm() {
            editingId = null;
            formTitle.textContent = 'New entry';
            formEl('job').value = '';
            formEl('company').value = '';
            formEl('platform').value = '';
            formEl('status').value = 'Completed';
            formEl('stage').value = 'Waiting answer';
            formEl('date').value = '';
            formEl('link').value = '';
            formEl('notes').value = '';
            formCard.classList.add('open');
            formEl('job').focus();
        }

        function openEditForm(record) {
            editingId = record.id;
            formTitle.textContent = 'Edit entry';
            formEl('job').value = record.job || '';
            formEl('company').value = record.company || '';
            formEl('platform').value = record.platform || '';
            formEl('status').value = record.status || 'Completed';
            formEl('stage').value = record.stage || 'Waiting answer';
            formEl('date').value = record.dateSent || '';
            formEl('link').value = record.link || '';
            formEl('notes').value = record.notes || '';
            formCard.classList.add('open');
            formCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            formEl('job').focus();
        }

        function closeForm() {
            editingId = null;
            formCard.classList.remove('open');
        }

        function handleSave() {
            const job = formEl('job').value.trim();
            const company = formEl('company').value.trim();
            if (!job || !company) {
                alert('Job and Company are required.');
                return;
            }
            const data = {
                job,
                company,
                platform: formEl('platform').value.trim(),
                status: formEl('status').value,
                stage: formEl('stage').value,
                dateSent: formEl('date').value.trim(),
                link: formEl('link').value.trim(),
                notes: formEl('notes').value.trim()
            };

            if (editingId) {
                records = records.map(r => r.id === editingId ? { ...r, ...data } : r);
            } else {
                records = [...records, { id: `custom-${Date.now()}`, ...data }];
            }
            saveRecords(records);
            closeForm();
            render();
        }

        function handleDelete(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;
            if (!confirm(`Delete "${record.job}" at "${record.company}"?`)) return;
            records = records.filter(r => r.id !== id);
            saveRecords(records);
            render();
        }

        addToggleBtn.addEventListener('click', () => {
            if (formCard.classList.contains('open') && !editingId) {
                closeForm();
            } else {
                openAddForm();
            }
        });
        formSaveBtn.addEventListener('click', handleSave);
        formCancelBtn.addEventListener('click', closeForm);

        function render() {
            if (records.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                tallyRow.innerHTML = '';
                return;
            }

            table.style.display = 'table';
            emptyState.style.display = 'none';

            const counts = { total: records.length, interview: 0, rejected: 0, waiting: 0, offer: 0 };
            records.forEach(a => {
                if (a.stage === "Interview") counts.interview++;
                else if (a.stage === "Rejected") counts.rejected++;
                else if (a.stage === "Offer") counts.offer++;
                else counts.waiting++;
            });

            const stats = [
                { num: counts.total, label: "Total" },
                { num: counts.interview, label: "Interview" },
                { num: counts.offer, label: "Offer" },
                { num: counts.waiting, label: "Waiting answer" },
                { num: counts.rejected, label: "Rejected" }
            ];
            tallyRow.innerHTML = stats.map(s => `
                <div class="tally-item">
                    <div class="tally-num">${s.num}</div>
                    <div class="tally-label">${s.label}</div>
                </div>
            `).join('');

            // Open applications (anything not yet rejected) stay at the top;
            // rejected ones sink to the bottom. Stable sort, so relative
            // order within each group is otherwise untouched.
            const sortedRecords = [...records].sort((a, b) => {
                const aRejected = a.stage === "Rejected" ? 1 : 0;
                const bRejected = b.stage === "Rejected" ? 1 : 0;
                return aRejected - bRejected;
            });

            // The last open row (if a boundary actually exists) gets a
            // double rule to mark the split before rejected applications.
            const firstRejectedIndex = sortedRecords.findIndex(a => a.stage === "Rejected");
            const boundaryIndex = firstRejectedIndex > 0 ? firstRejectedIndex - 1 : -1;

            tbody.innerHTML = sortedRecords.map((a, i) => {
                const jobCell = a.appFolder
                    ? `<a class="jd-link cell-job" href="job-view.html?folder=${encodeURIComponent(a.appFolder)}&title=${encodeURIComponent(a.job)}&company=${encodeURIComponent(a.company)}">${escapeHtml(a.job)}</a>`
                    : `<span class="cell-job">${escapeHtml(a.job)}</span>`;
                const linkCell = a.link
                    ? `<a class="jd-link" href="${escapeHtml(a.link)}" target="_blank" rel="noopener">View posting</a>`
                    : `<span class="cell-faint">&mdash;</span>`;
                return `
                    <tr${i === boundaryIndex ? ' class="stage-boundary"' : ''}>
                        <td>${jobCell}</td>
                        <td class="cell-muted">${escapeHtml(a.company)}</td>
                        <td class="cell-muted">${escapeHtml(a.platform)}</td>
                        <td class="cell-muted">${escapeHtml((a.status || '').toLowerCase())}</td>
                        <td><span class="stamp ${stageStamp(a.stage)}">${escapeHtml(a.stage)}</span></td>
                        <td class="cell-muted">${escapeHtml(a.dateSent) || '&mdash;'}</td>
                        <td>${linkCell}</td>
                        <td class="cell-muted">${escapeHtml(a.notes) || '&mdash;'}</td>
                        <td>
                            <div class="row-actions">
                                <button class="btn-plain" data-edit="${a.id}">Edit</button>
                                <button class="btn-plain danger" data-delete="${a.id}">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.querySelectorAll('[data-edit]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const record = records.find(r => r.id === btn.getAttribute('data-edit'));
                    if (record) openEditForm(record);
                });
            });
            tbody.querySelectorAll('[data-delete]').forEach(btn => {
                btn.addEventListener('click', () => handleDelete(btn.getAttribute('data-delete')));
            });
        }

        render();
    </script>

</body>

</html>
