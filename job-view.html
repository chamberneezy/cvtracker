<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Breljak – Job Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #EFE8D6;
            --paper-raised: #E6DCC0;
            --line: #D3C6A0;
            --line-strong: #B8A878;
            --ink: #1C2430;
            --ink-soft: #5B6270;
            --ink-faint: #9AA0AD;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--paper);
            color: var(--ink);
            padding: 2.5rem 1.5rem 3.5rem;
            line-height: 1.55;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            font-size: 0.78rem;
            color: var(--ink-soft);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .back-link:hover {
            color: var(--ink);
            text-decoration: underline;
        }

        .page-header {
            padding-bottom: 1.25rem;
            border-bottom: 2px solid var(--ink);
            margin-bottom: 1.75rem;
        }

        .page-title {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -0.01em;
            line-height: 1.15;
        }

        .page-subtitle {
            font-size: 0.8rem;
            color: var(--ink-soft);
            margin-top: 0.4rem;
        }

        .doc-block {
            border: 1px solid var(--ink);
            margin-bottom: 1.75rem;
        }

        .doc-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--line-strong);
        }

        .doc-block-title {
            font-size: 0.82rem;
            font-weight: 600;
        }

        .doc-block-open {
            font-size: 0.74rem;
            color: var(--ink-soft);
            text-decoration: none;
            white-space: nowrap;
        }

        .doc-block-open:hover {
            color: var(--ink);
            text-decoration: underline;
        }

        .doc-frame {
            width: 100%;
            height: 82vh;
            border: none;
            display: block;
        }

        .empty-state {
            font-size: 0.8rem;
            color: var(--ink-soft);
            padding: 2rem 0;
        }
    </style>
</head>

<body>

    <div class="page">
        <a class="back-link" href="index.html">&lsaquo; Job Applications</a>

        <div class="page-header">
            <h1 class="page-title" id="job-title">Job Application</h1>
            <p class="page-subtitle" id="job-company"></p>
        </div>

        <div id="content"></div>
        <p class="empty-state" id="empty-state" style="display:none;">No job specified.</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const folder = params.get('folder');
        const title = params.get('title') || 'Job Application';
        const company = params.get('company') || '';

        document.getElementById('job-title').textContent = title;
        document.getElementById('job-company').textContent = company;

        const content = document.getElementById('content');
        const emptyState = document.getElementById('empty-state');

        if (!folder) {
            emptyState.style.display = 'block';
        } else {
            const cvPath = `jobs/${folder}/cv.html`;
            const coverPath = `jobs/${folder}/cover_letter.html`;

            content.innerHTML = `
                <div class="doc-block">
                    <div class="doc-block-header">
                        <span class="doc-block-title">CV</span>
                        <a class="doc-block-open" href="${cvPath}" target="_blank" rel="noopener">Open full page</a>
                    </div>
                    <iframe class="doc-frame" src="${cvPath}" title="CV"></iframe>
                </div>
                <div class="doc-block">
                    <div class="doc-block-header">
                        <span class="doc-block-title">Cover letter</span>
                        <a class="doc-block-open" href="${coverPath}" target="_blank" rel="noopener">Open full page</a>
                    </div>
                    <iframe class="doc-frame" src="${coverPath}" title="Cover Letter"></iframe>
                </div>
            `;
        }
    </script>

</body>

</html>
