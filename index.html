<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Breljak – Job Applications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #EFE8D6;
            --paper-raised: #E6DCC0;
            --line: #D3C6A0;
            --line-strong: #B8A878;
            --ink: #1C2430;
            --ink-soft: #5B6270;
            --ink-faint: #9AA0AD;
            --red: #A63B2E;
            --green: #2E5C3E;
            --amber: #7C5D1F;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--paper);
            color: var(--ink);
            padding: 3.5rem 1.5rem;
            line-height: 1.55;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding-bottom: 1.25rem;
            border-bottom: 2px solid var(--ink);
        }

        .page-title {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 2.1rem;
            letter-spacing: -0.01em;
            line-height: 1.05;
        }

        .page-subtitle {
            font-size: 0.8rem;
            color: var(--ink-soft);
            margin-top: 0.55rem;
            max-width: 46ch;
        }

        .ink-btn {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--ink);
            text-decoration: none;
            padding: 0.5rem 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
        }

        .ink-btn:hover,
        .ink-btn:focus-visible {
            background: var(--ink);
            color: var(--paper);
        }

        .ink-btn:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px;
        }

        .manifest-head {
            display: grid;
            grid-template-columns: 3.5rem 1fr auto;
            gap: 1rem;
            padding: 1.1rem 0.25rem 0.5rem;
            font-size: 0.66rem;
            color: var(--ink-faint);
            border-bottom: 1px solid var(--line-strong);
        }

        .manifest-row {
            display: grid;
            grid-template-columns: 3.5rem 1fr auto;
            gap: 1rem;
            align-items: center;
            padding: 1rem 0.25rem;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background 0.12s ease;
        }

        .manifest-row:hover,
        .manifest-row:focus-visible {
            background: var(--paper-raised);
            outline: none;
        }

        .manifest-row:focus-visible {
            box-shadow: inset 3px 0 0 var(--ink);
        }

        .ref {
            font-size: 0.72rem;
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
        }

        .role {
            font-size: 0.92rem;
            font-weight: 600;
        }

        .company {
            font-size: 0.76rem;
            color: var(--ink-soft);
            margin-top: 0.2rem;
        }

        .verdict {
            display: inline-block;
            margin-top: 0.45rem;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.12rem 0.4rem;
            border: 1px solid currentColor;
        }

        .verdict-apply { color: var(--green); }
        .verdict-longshot { color: var(--red); }

        .assess {
            display: flex;
        }

        .assess-item {
            padding: 0 0.65rem;
            border-left: 1px solid var(--line);
            font-size: 0.72rem;
            font-weight: 600;
            text-align: center;
        }

        .assess-item:first-child {
            border-left: none;
            padding-left: 0;
        }

        .assess-item small {
            display: block;
            font-size: 0.58rem;
            font-weight: 500;
            color: var(--ink-faint);
            margin-top: 2px;
        }

        .tone-excellent { color: var(--green); }
        .tone-good { color: var(--amber); }
        .tone-poor { color: var(--red); }
        .tone-neutral { color: var(--ink-soft); }

        .empty-state {
            font-size: 0.8rem;
            color: var(--ink-soft);
            padding: 2rem 0.25rem;
            border-bottom: 1px solid var(--line);
        }

        @media (max-width: 560px) {
            .manifest-head {
                display: none;
            }

            .manifest-row {
                grid-template-columns: 1fr;
                gap: 0.35rem;
            }

            .assess {
                border-top: 1px solid var(--line);
                padding-top: 0.5rem;
                margin-top: 0.25rem;
            }
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="page-header">
            <div>
                <h1 class="page-title">Job Applications</h1>
                <p class="page-subtitle">Every tailored CV and cover letter, filed by application.</p>
            </div>
            <a class="ink-btn" href="tracker.html">Job Hunt Tracker</a>
        </div>

        <div class="manifest-head" id="manifest-head">
            <span>Ref</span>
            <span>Role</span>
            <span>Assessment</span>
        </div>
        <div id="job-list"></div>
        <p class="empty-state" id="empty-state" style="display:none;">No job applications filed yet.</p>
    </div>

    <script>
        // Add one entry per folder under jobs/. Each folder must contain
        // cv.html and cover_letter.html.
        //
        // Scoring fields (computed once when the job is created — see
        // CLAUDE.md "Job Application Workflow" for the methodology):
        //   fitScore       0-10 fit assessment from the CV skill's Step 1
        //   matchLevel     "Poor" (<5) / "Good" (5-7.4) / "Excellent" (>=7.5)
        //   atsScore       0-100, % of JD keywords/phrases found verbatim
        //                  in the tailored CV + cover letter
        //   adjustment     "Low" (<35%) / "Medium" (35-65%) / "High" (>65%)
        //                  content-similarity diff vs. the base template
        //   verdict        "Apply" / "Long Shot" — Claude's own judgment call on
        //                  whether this is genuinely worth applying to, set during
        //                  Step 1 of the CV skill. Usually tracks matchLevel
        //                  (Poor -> Long Shot) but is a separate, deliberate call,
        //                  not an auto-derived threshold.
        const jobs = [
            {
                title: "Online Marketing & Social Media Manager",
                company: "Pistor AG",
                folder: "online-marketing-social-media-manager-pistor",
                fitScore: 6.5,
                matchLevel: "Good",
                atsScore: 81,
                adjustment: "High",
                verdict: "Apply"
            },
            {
                title: "Digital Marketing Manager (Social Media)",
                company: "STOXX Ltd.",
                folder: "digital-marketing-manager-social-media-stoxx",
                fitScore: 4.5,
                matchLevel: "Poor",
                atsScore: 75,
                adjustment: "Low",
                verdict: "Long Shot"
            },
            {
                title: "Digital Marketing & E-Business Specialist",
                company: "MÜLLER-STEINAG Gruppe (Creabeton)",
                folder: "digital-marketing-e-business-specialist-creabeton",
                fitScore: 8,
                matchLevel: "Excellent",
                atsScore: 100,
                adjustment: "Medium",
                verdict: "Apply"
            },
            {
                title: "Digital Account Manager SEM",
                company: "Publicis Media",
                folder: "digital-account-manager-sem-publicis-media",
                fitScore: 8,
                matchLevel: "Excellent",
                atsScore: 95,
                adjustment: "Medium",
                verdict: "Apply"
            },
            {
                title: "Global Digital Marketing & Content Specialist",
                company: "SFC KOENIG",
                folder: "content-digital-marketing-manager-sfc-koenig-dsg",
                fitScore: 4,
                matchLevel: "Poor",
                atsScore: 65,
                adjustment: "Medium",
                verdict: "Long Shot"
            },
            {
                title: "Digital Marketing Manager",
                company: "Maison Truffe AG",
                folder: "digital-marketing-manager-maison-truffe",
                fitScore: 6,
                matchLevel: "Good",
                atsScore: 75,
                adjustment: "Medium",
                verdict: "Apply"
            },
            {
                title: "E-Commerce Sales & Growth Manager",
                company: "FREITAG lab AG",
                folder: "ecommerce-sales-growth-manager-freitag",
                fitScore: 4,
                matchLevel: "Poor",
                atsScore: 65,
                adjustment: "Medium",
                verdict: "Long Shot"
            },
            {
                title: "SEA & Campaign Manager",
                company: "easylearn",
                folder: "sea-campaign-manager-easylearn",
                fitScore: 8,
                matchLevel: "Excellent",
                atsScore: 100,
                adjustment: "Low",
                verdict: "Apply"
            },
            {
                title: "Web & Digital Marketing Koordinator*in",
                company: "Götti Switzerland / Eyetech",
                folder: "web-digital-marketing-koordinator-goetti-eyetech",
                fitScore: 8,
                matchLevel: "Excellent",
                atsScore: 95,
                adjustment: "Medium",
                verdict: "Apply"
            },
            {
                title: "Senior Digital Marketing Manager",
                company: "asm Fundraising AG",
                folder: "senior-digital-marketing-manager-asm-fundraising",
                fitScore: 7.5,
                matchLevel: "Excellent",
                atsScore: 50,
                adjustment: "Medium",
                verdict: "Apply"
            },
            {
                title: "Marketing Allrounder (Digital Focus)",
                company: "profawo / kids&co / care&co",
                folder: "marketing-allrounder-profawo-kidsco-careco",
                fitScore: 4.5,
                matchLevel: "Poor",
                atsScore: 85,
                adjustment: "Medium",
                verdict: "Long Shot"
            },
            {
                title: "Mitarbeiter/-in Digital Business",
                company: "Sanitas Troesch",
                folder: "mitarbeiter-digital-business-sanitas-troesch",
                fitScore: 7,
                matchLevel: "Good",
                atsScore: 50,
                adjustment: "Medium",
                verdict: "Apply"
            },
            {
                title: "E-Commerce & Digital Marketing Manager",
                company: "COLLAMIN",
                folder: "ecommerce-digital-marketing-manager-collamin",
                fitScore: 6,
                matchLevel: "Good",
                atsScore: 75,
                adjustment: "Medium",
                verdict: "Apply"
            },
            {
                title: "Digital Analyst (E-Commerce)",
                company: "NZZ",
                folder: "digital-analyst-ecommerce-nzz",
                fitScore: 9,
                matchLevel: "Excellent",
                atsScore: 90,
                adjustment: "Medium",
                verdict: "Apply"
            }
        ];

        const list = document.getElementById('job-list');
        const emptyState = document.getElementById('empty-state');
        const manifestHead = document.getElementById('manifest-head');

        function matchTone(level) {
            if (level === "Excellent") return "tone-excellent";
            if (level === "Good") return "tone-good";
            return "tone-poor";
        }

        function atsTone(score) {
            if (score >= 80) return "tone-excellent";
            if (score >= 60) return "tone-good";
            return "tone-poor";
        }

        function verdictClass(verdict) {
            return verdict === "Apply" ? "verdict-apply" : "verdict-longshot";
        }

        // Ref numbers are permanent case IDs tied to each job's position in
        // the array above (creation order) — they're assigned before sorting
        // so they don't shuffle around when the display order changes below.
        const jobsWithRef = jobs.map((job, i) => ({ ...job, ref: String(i + 1).padStart(4, '0') }));

        // Display order: highest fit first, then Apply before Long Shot as a
        // tiebreaker — recomputed on every load, not a one-time manual sort.
        const sortedJobs = [...jobsWithRef].sort((a, b) => {
            if (b.fitScore !== a.fitScore) return b.fitScore - a.fitScore;
            if (a.verdict !== b.verdict) return a.verdict === "Apply" ? -1 : 1;
            return 0;
        });

        if (jobs.length === 0) {
            manifestHead.style.display = 'none';
            emptyState.style.display = 'block';
        } else {
            sortedJobs.forEach((job) => {
                const row = document.createElement('div');
                row.className = 'manifest-row';
                row.tabIndex = 0;
                row.setAttribute('role', 'button');
                row.setAttribute('aria-label', `Open CV and cover letter for ${job.title} at ${job.company}`);

                row.innerHTML = `
                    <div class="ref">${job.ref}</div>
                    <div>
                        <div class="role">${job.title}</div>
                        <div class="company">${job.company}</div>
                        <span class="verdict ${verdictClass(job.verdict)}">${job.verdict}</span>
                    </div>
                    <div class="assess">
                        <span class="assess-item ${matchTone(job.matchLevel)}">${job.fitScore}<small>fit</small></span>
                        <span class="assess-item ${atsTone(job.atsScore)}">${job.atsScore}%<small>ats</small></span>
                        <span class="assess-item tone-neutral">${job.adjustment}<small>adj</small></span>
                    </div>
                `;

                const open = () => {
                    const params = new URLSearchParams({
                        folder: job.folder,
                        title: job.title,
                        company: job.company
                    });
                    window.location.href = `job-view.html?${params.toString()}`;
                };

                row.addEventListener('click', open);
                row.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        open();
                    }
                });

                list.appendChild(row);
            });
        }
    </script>

</body>

</html>
